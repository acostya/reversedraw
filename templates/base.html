{% load static %}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Reverse Draw{% endblock %}</title>
<link rel="stylesheet" href="{% static 'draws/style.css' %}">
</head>
<body>
<header class="site-header">
  <a href="{% url 'draws:event_list' %}" class="brand">Reverse Draw</a>
  {% if user.is_authenticated %}
    <form action="{% url 'logout' %}" method="post" class="logout-form">{% csrf_token %}<button type="submit">Log out</button></form>
  {% endif %}
</header>
<main>
{% if messages %}
  <ul class="messages">
    {% for message in messages %}<li class="{{ message.tags }}">{{ message }}</li>{% endfor %}
  </ul>
{% endif %}
{% block content %}{% endblock %}
</main>
</body>
</html>
