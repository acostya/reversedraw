{% extends "base.html" %}
{% block title %}Events — Reverse Draw{% endblock %}
{% block content %}
<h1>Events</h1>
<a href="{% url 'draws:event_create' %}" class="button primary">+ New event</a>
<table class="event-table">
  <thead>
    <tr><th>Name</th><th>Called</th><th></th></tr>
  </thead>
  <tbody>
    {% for event in events %}
    <tr>
      <td>{{ event.name }}</td>
      <td>{{ event.called_count }}</td>
      <td class="actions">
        <a href="{% url 'draws:board' event.slug %}">Open board</a>
      </td>
    </tr>
    {% empty %}
    <tr><td colspan="3">No events yet.</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
