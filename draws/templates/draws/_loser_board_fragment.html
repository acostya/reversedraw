<div class="stats-bar">
  <div class="stat"><span class="stat-value">{{ calls.last.number|default:"—" }}</span><span class="stat-label">Latest pull</span></div>
  <div class="stat"><span class="stat-value">{{ calls.count }}</span><span class="stat-label">Called</span></div>
</div>
<div class="loser-board">
  {% for call in calls %}
  <span class="ticket">{{ call.number }}</span>
  {% empty %}
  <p class="empty">No numbers called yet.</p>
  {% endfor %}
</div>
